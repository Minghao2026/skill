# 铭昊宝塔服务器对接 · 连接配置（占位符版，请替换为真实信息）
# 复制到本会话的 ~/.openclaw/minghao-baota.yaml 后填写
servers:
  - name: prod
    panel_url: "https://面板IP:端口/安全入口"   # 必须带"安全入口"路径
    username: "面板账号"
    password: "面板密码"
    api_key: ""               # 可选：宝塔 API 接口密钥；填了数据库写操作优先走 DoSql
    remote_root: "/www/wwwroot/shiwangtuan"
    database: "数据库名"
    site_url: "https://站点域名"             # 一次性执行器兜底需要站点地址
    verify_ssl: false
